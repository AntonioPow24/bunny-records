<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Bunny logo · prueba</title>
<style>
body{margin:0;font:14px system-ui,sans-serif;background:#0C111C;color:#F4F4F2}
section{padding:24px 32px}
h2{font-weight:600;font-size:15px;margin:0 0 12px;color:#9BA3B0}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.tile{border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:center}
.mid{background:#0C111C;border:1px solid #263042}.teal{background:#329DA8}.ivory{background:#F4F4F2}.ink{background:#080A0D}
.tile img{height:150px}
.sizes .tile{padding:14px}
.sizes span{display:block;text-align:center;color:#9BA3B0;margin-top:6px;font-size:12px}
</style></head><body>
<section><h2>Logo principal por fondo (sobre teal usa la sombra Deep Teal)</h2><div class="row">
<div class="tile mid"><img src="bunny-logo.svg" alt=""></div>
<div class="tile teal"><img src="bunny-logo-on-teal.svg" alt=""></div>
<div class="tile ivory"><img src="bunny-logo.svg" alt=""></div>
<div class="tile ink"><img src="bunny-logo.svg" alt=""></div>
</div></section>
<section><h2>Monocromo</h2><div class="row">
<div class="tile mid"><img src="bunny-logo-mono-ivory.svg" alt=""></div>
<div class="tile ivory"><img src="bunny-logo-mono-ink.svg" alt=""></div>
<div class="tile teal"><img src="bunny-logo-mono-ink.svg" alt=""></div>
</div></section>
<section class="sizes"><h2>Tamaños: icono (arriba, misma cara que el logo en lienzo cuadrado) vs logo (abajo)</h2>
<div class="row">
<div><div class="tile mid"><img src="bunny-icon.svg" style="height:16px" alt=""></div><span>16</span></div>
<div><div class="tile mid"><img src="bunny-icon.svg" style="height:32px" alt=""></div><span>32</span></div>
<div><div class="tile mid"><img src="bunny-icon.svg" style="height:64px" alt=""></div><span>64</span></div>
<div><div class="tile mid"><img src="bunny-icon.svg" style="height:180px" alt=""></div><span>180</span></div>
</div><div class="row" style="margin-top:16px">
<div><div class="tile mid"><img src="bunny-logo.svg" style="height:16px" alt=""></div><span>16</span></div>
<div><div class="tile mid"><img src="bunny-logo.svg" style="height:32px" alt=""></div><span>32</span></div>
<div><div class="tile mid"><img src="bunny-logo.svg" style="height:64px" alt=""></div><span>64</span></div>
<div><div class="tile mid"><img src="bunny-logo.svg" style="height:180px" alt=""></div><span>180</span></div>
<div><div class="tile mid"><img src="bunny-logo.svg" style="height:512px" alt=""></div><span>512</span></div>
</div></section>
<section><h2>Comparación: ojo del logo (izq., recortado de bunny-logo.svg) y glyph-plus.svg (der.), al mismo tamaño</h2><div class="row">
<div class="tile ivory"><svg width="91" height="91" viewBox="184.5 636.5 91 91"><image href="bunny-logo.svg" x="0" y="0" width="800" height="922"/></svg></div>
<div class="tile ivory"><img src="glyph-plus.svg" style="height:91px" alt=""></div>
</div></section><section><h2>Glifos</h2><div class="row">
<div class="tile ivory"><img src="glyph-plus.svg" style="height:60px" alt=""></div>
<div class="tile ivory"><img src="glyph-minus.svg" style="height:30px" alt=""></div>
<div class="tile mid"><img src="glyph-ears.svg" style="height:120px" alt=""></div>
</div></section>
</body></html>
